<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Machine Detective Online Alpha</title><style>
body{font-family:system-ui;background:#eef3f6;color:#173342;margin:0}header{background:#10283a;color:white;padding:20px}main{max-width:760px;margin:auto;padding:14px}.card{background:white;border-radius:14px;padding:16px;margin:12px 0}input,textarea,select,button{font:inherit;padding:11px;border:1px solid #ccd5da;border-radius:8px;box-sizing:border-box;width:100%;margin:5px 0}button{background:#087b80;color:white;font-weight:bold;border:0}button.secondary{background:#e4eef1;color:#173342}.muted{color:#5a707b;font-size:13px}#app{display:none}.order{border-top:1px solid #ddd;padding:14px 0}.badge{background:#e0f5ee;border-radius:12px;padding:4px 8px}.warning{background:#fff3d9;padding:12px;border-radius:10px}</style></head><body><header><h2>🔍 Machine Detective</h2><div>Online Alpha · 两部手机云端订单测试</div></header><main><div class="warning">🧪 这是独立的联网基础测试，不是 V0.7 全功能版；无真实付款、托管或管理员权限。请勿填写真实客户敏感资料。</div><div id="msg" class="card">准备连接 Firebase…</div><section id="auth" class="card"><h3>注册 / 登录</h3><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="密码（至少6位）"><button id="register">注册</button><button id="login" class="secondary">登录</button></section><section id="app"><div class="card"><b id="who"></b><button id="logout" class="secondary">退出登录</button></div><div class="card"><h3>创建订单（客户）</h3><input id="machine" maxlength="80" placeholder="机械型号，例如 SK200-6E"><textarea id="problem" maxlength="1000" placeholder="故障现象"></textarea><button id="create">发布测试订单</button></div><div class="card"><h3>订单列表（测试阶段）</h3><p class="muted">已登录用户均可查看测试订单。只有发布人可取消；其他账号可接单。正式版会按角色、资质、地区及订单授权进一步隔离。</p><div id="orders">读取中…</div></div></section></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,collection,addDoc,query,orderBy,onSnapshot,doc,runTransaction,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const config={apiKey:"AIzaSyCQeRSbZSW0Hw37RjO9JtDPDmxXShTXlWM",authDomain:"machine-detective.firebaseapp.com",projectId:"machine-detective",storageBucket:"machine-detective.firebasestorage.app",messagingSenderId:"825860805968",appId:"1:825860805968:web:60251c4da79652aa520855"};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id),msg=t=>$('msg').textContent=t,escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]));
let current=null,unsub=null,cache=[];
const friendly=e=>{console.error(e);msg('操作失败：'+(e?.code||e?.message||String(e)))};
$('register').onclick=async()=>{try{await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){friendly(e)}};
$('login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){friendly(e)}};
$('logout').onclick=()=>signOut(auth).catch(friendly);
onAuthStateChanged(auth,user=>{current=user;if(unsub){unsub();unsub=null}$('auth').style.display=user?'none':'block';$('app').style.display=user?'block':'none';if(!user){msg('请登录或注册。');return}$('who').textContent='登录账号：'+user.email;msg('已连接云端（测试版）');unsub=onSnapshot(query(collection(db,'orders'),orderBy('createdAt','desc')),snap=>{cache=snap.docs.map(d=>({id:d.id,...d.data()}));render()},friendly)});
$('create').onclick=async()=>{if(!current)return;let machine=$('machine').value.trim(),problem=$('problem').value.trim();if(!machine||!problem){msg('请填写机械型号及故障描述');return}try{await addDoc(collection(db,'orders'),{machine,problem,customerUid:current.uid,technicianUid:null,status:'open',createdAt:serverTimestamp()});$('machine').value='';$('problem').value='';msg('订单已发布，另一部手机会同步显示')}catch(e){friendly(e)}};
function render(){if(!current)return;$('orders').innerHTML=cache.length?cache.map(o=>`<div class="order"><b>${escape(o.machine)}</b> <span class="badge">${o.status==='open'?'待接单':o.status==='accepted'?'已接单':o.status==='cancelled'?'已取消':escape(o.status)}</span><p>${escape(o.problem)}</p><div class="muted">订单编号 ${escape(o.id)}<br>客户UID：${escape(o.customerUid)}</div>${o.status==='open'&&o.customerUid!==current.uid?`<button data-act="accept" data-id="${escape(o.id)}">接单</button>`:''}${o.status==='open'&&o.customerUid===current.uid?`<button class="secondary" data-act="cancel" data-id="${escape(o.id)}">取消订单</button>`:''}</div>`).join(''):'暂无测试订单'}
$('orders').onclick=async e=>{const b=e.target.closest('[data-act]');if(!b||!current)return;const id=b.dataset.id,act=b.dataset.act;try{await runTransaction(db,async tx=>{const ref=doc(db,'orders',id),snap=await tx.get(ref);if(!snap.exists())throw Error('订单不存在');const o=snap.data();if(o.status!=='open')throw Error('订单已被接单或取消');if(act==='accept'){if(o.customerUid===current.uid)throw Error('不能接自己的订单');tx.update(ref,{status:'accepted',technicianUid:current.uid})}else if(act==='cancel'){if(o.customerUid!==current.uid)throw Error('不是你的订单');tx.update(ref,{status:'cancelled'})}});msg(act==='accept'?'接单成功':'已取消')}catch(err){friendly(err)}};
</script></body></html>
